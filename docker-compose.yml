services:
  db:
    image: postgres:16-alpine
    container_name: monitor-db
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies database migrations, then exits. The API waits for it to finish.
  migrate:
    build: ./backend
    image: monitor-api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://monitor:monitor@db:5432/monitor
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true  # inherited from the image, but this one-shot job is not a server

  api:
    build: ./backend
    image: monitor-api
    container_name: monitor-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://monitor:monitor@db:5432/monitor
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
